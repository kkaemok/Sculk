[package]
name = "sculk-protocol"
description = "Bounded experimental LOCO framing and BSON validation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytes.workspace = true
bson.workspace = true
thiserror.workspace = true
tokio-util.workspace = true

[dev-dependencies]
proptest = "1"

[[bench]]
name = "codec"
harness = false
path = "../../benches/codec.rs"

[features]
# Explicit transitive features ensure expanded keys/hash state are cleared on drop.
experimental-gcm = ["dep:aes-gcm", "aes-gcm/zeroize", "dep:aes", "dep:ghash", "dep:polyval", "dep:rand"]
loco-handshake = ["experimental-gcm", "dep:rsa", "dep:sha1", "dep:zeroize"]

[dependencies.aes-gcm]
version = "0.10"
optional = true

[dependencies.rand]
version = "0.8"
optional = true

[dependencies.rsa]
version = "0.9"
optional = true

[dependencies.sha1]
version = "0.10"
optional = true

[dependencies.zeroize]
version = "1"
optional = true

[[bench]]
name = "encryption"
harness = false
path = "../../benches/encryption.rs"
required-features = ["experimental-gcm"]

# Already transitive crypto primitives, listed to activate their supported cleanup.
[dependencies.aes]
version = "0.8"
features = ["zeroize"]
optional = true
[dependencies.ghash]
version = "0.5"
features = ["zeroize"]
optional = true
[dependencies.polyval]
version = "0.6"
features = ["zeroize"]
optional = true
