[package]
name = "sculk-bot"
description = "Bounded asynchronous bot commands and event dispatch for Sculk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
sculk-client = { workspace = true, features = ["synchronization"] }
tokio.workspace = true
thiserror.workspace = true

[features]
default = []
managed-client = ["sculk-client/session-recovery"]

[dev-dependencies]
bson.workspace = true
sculk-protocol.workspace = true
tokio = { workspace = true, features = ["test-util"] }
futures-util.workspace = true
tokio-util.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[[bench]]
name = "dispatch"
harness = false
