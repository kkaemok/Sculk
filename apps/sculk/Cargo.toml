[package]
name = "sculk"
description = "Sculk script bot host and offline console"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
live-validation = ["dep:sculk-auth-client"]

[dependencies]
sculk-auth-client = { path = "../../examples/auth-client", features = ["live"], optional = true }
bson.workspace = true
sculk-bot.workspace = true
sculk-protocol.workspace = true
sculk-script.workspace = true
tokio.workspace = true
serde = { version = "1", features = ["derive"] }
toml = "0.9"
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
tempfile = "3"
sculk-client = { workspace = true, features = ["messaging"] }
futures-util.workspace = true
tokio-util.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
