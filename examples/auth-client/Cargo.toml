[package]
name = "sculk-auth-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
[features]
default = []
live = ["dep:sculk-client", "sculk-client/android-auth", "sculk-client/read-only", "sculk-client/messaging", "dep:libc", "dep:sha2", "dep:sculk-protocol", "sculk-protocol/loco-handshake", "dep:tokio", "dep:serde", "dep:serde_json", "dep:zeroize", "dep:rpassword", "dep:rustls-native-certs"]
[[bin]]
name = "sculk-auth-client"
path = "src/main.rs"
required-features = ["live"]
[dependencies]
sculk-client = { workspace = true, optional = true }
sculk-protocol = { workspace = true, optional = true }
tokio = { workspace = true, features = ["signal"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
zeroize = { version = "1", optional = true }
rpassword = { version = "7", optional = true }
rustls-native-certs = { version = "0.8", optional = true }

[dependencies.libc]
version = "0.2"
optional = true
[dependencies.sha2]
version = "0.10"
optional = true
