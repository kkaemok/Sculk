name: Rust
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --all-features --locked
      - run: cargo build --workspace --release --all-features --locked
      - name: Run the offline console
        shell: bash
        run: |
          project="$(mktemp -d)"
          cargo run -p sculk --locked -- --config "$project/sculk.toml" init
          cargo run -p sculk --locked -- --config "$project/sculk.toml" script check
          printf '!ping\n:quit\n' | cargo run -p sculk --locked -- --config "$project/sculk.toml" run --offline
      - run: cargo run -p sculk-basic-client --locked
      - run: cargo run -p sculk-basic-bot --locked
      - run: cargo run -p sculk-script-bot --locked
      - run: cargo run -p sculk-addon-bot --locked
      - run: cargo run -p sculk-auth-client --features live --locked -- --help
      - run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo check --manifest-path fuzz/Cargo.toml --locked
